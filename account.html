<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neris | Hesabım</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .header {
      border-bottom: 1px solid #222;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #e4bd35;
      font-family: Georgia, serif;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 4px;
      text-decoration: none;
    }

    .back {
      color: #ddd;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #e4bd35;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 60px auto;
    }

    .title {
      font-family: Georgia, serif;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 40px;
    }

    .account-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 25px;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid #262626;
      padding: 28px;
    }

    .menu button {
      width: 100%;
      background: transparent;
      color: #ddd;
      border: none;
      border-bottom: 1px solid #222;
      padding: 17px 5px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
    }

    .menu button:hover,
    .menu button.active {
      color: #e4bd35;
    }

    .section-title {
      font-family: Georgia, serif;
      font-size: 27px;
      margin-bottom: 25px;
    }

    .info-row {
      border-bottom: 1px solid #222;
      padding: 18px 0;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .label {
      color: #888;
    }

    .value {
      color: #fff;
      text-align: right;
    }

    .gold-button {
      margin-top: 25px;
      background: #e4bd35;
      color: #050505;
      border: none;
      padding: 14px 25px;
      cursor: pointer;
      font-weight: bold;
    }

    .empty {
      color: #777;
      padding: 30px 0;
      line-height: 1.7;
    }

    .message {
      margin-top: 20px;
      padding: 14px;
      display: none;
      border: 1px solid #444;
    }

    .loading {
      color: #aaa;
    }

    @media (max-width: 700px) {
      .header {
        padding: 18px 5%;
      }

      .logo {
        font-size: 24px;
      }

      .container {
        margin: 35px auto;
      }

      .title {
        font-size: 32px;
      }

      .account-grid {
        grid-template-columns: 1fr;
      }

      .info-row {
        flex-direction: column;
      }

      .value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="index.html" class="logo">NERIS</a>
    <a href="index.html" class="back">← Ana Sayfaya Dön</a>
  </header>

  <main class="container">

    <h1 class="title">Hesabım</h1>
    <p class="subtitle">Neris hesabınızı buradan yönetebilirsiniz.</p>

    <div class="account-grid">

      <div class="card menu">

        <button class="active" onclick="showSection('profile', this)">
          Hesap Bilgilerim
        </button>

        <button onclick="showSection('orders', this)">
          Siparişlerim
        </button>

        <button onclick="showSection('favorites', this)">
          Favorilerim
        </button>

        <button onclick="logout()">
          Çıkış Yap
        </button>

      </div>

      <div class="card">

        <!-- HESAP -->
        <section id="profile">

          <h2 class="section-title">Hesap Bilgilerim</h2>

          <div class="info-row">
            <span class="label">Ad Soyad</span>
            <span class="value" id="userName">
              <span class="loading">Yükleniyor...</span>
            </span>
          </div>

          <div class="info-row">
            <span class="label">E-posta</span>
            <span class="value" id="userEmail">
              <span class="loading">Yükleniyor...</span>
            </span>
          </div>

          <div class="info-row">
            <span class="label">Kullanıcı ID</span>
            <span class="value" id="userId">
              <span class="loading">Yükleniyor...</span>
            </span>
          </div>

          <div id="message" class="message"></div>

        </section>


        <!-- SİPARİŞLER -->
       <section id="orders" style="display:none;">

    <h2 class="section-title">Siparişlerim</h2>

    <div id="ordersList">

        <div class="empty" id="ordersLoading">
            Siparişleriniz yükleniyor...
        </div>

    </div>

</section>


        <!-- FAVORİLER -->
        <section id="favorites" style="display:none;">

          <h2 class="section-title">Favorilerim</h2>

          <div class="empty">
            Henüz favorilerinize eklediğiniz bir ürün bulunmuyor.
          </div>

        </section>

      </div>

    </div>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // NERIS FIREBASE

    const firebaseConfig = {

      apiKey: "AIzaSyAQ0ses6c9fJnk5xDsh37-0-fLcCj-MVQw",

      authDomain: "neris-78944.firebaseapp.com",

      projectId: "neris-78944",

      storageBucket: "neris-78944.firebasestorage.app",

      messagingSenderId: "58960639184",

      appId: "1:58960639184:web:dc25f186f8887f64f1dad5",

      measurementId: "G-CVD06X8B82"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    // GİRİŞ KONTROLÜ

    onAuthStateChanged(auth, function(user) {

      if (!user) {

        window.location.href = "login.html";

        return;

      }


      const name =
        user.displayName ||
        user.email.split("@")[0];


      document.getElementById("userName").textContent = name;

      document.getElementById("userEmail").textContent =
        user.email;

      document.getElementById("userId").textContent =
        user.uid;

    });


    // ÇIKIŞ

    window.logout = async function() {

      const confirmLogout =
        confirm("Hesabınızdan çıkış yapmak istiyor musunuz?");

      if (!confirmLogout) return;


      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        alert("Çıkış yapılırken bir hata oluştu.");

        console.error(error);

      }

    };


    // MENÜLER

    window.showSection = function(section, button) {

      document.getElementById("profile").style.display = "none";

      document.getElementById("orders").style.display = "none";

      document.getElementById("favorites").style.display = "none";


      document.getElementById(section).style.display = "block";


      document.querySelectorAll(".menu button")
        .forEach(function(btn) {

          btn.classList.remove("active");

        });


      button.classList.add("active");

    };
// SİPARİŞLERİ FIREBASE'DEN GETİR
async function loadOrders(user) {
    const ordersList = document.getElementById("ordersList");

    if (!ordersList) return;

    ordersList.innerHTML = `
        <div class="empty">
            Siparişleriniz yükleniyor...
        </div>
    `;

    try {
        const ordersQuery = query(
            collection(db, "siparisler"),
            where("kullaniciId", "==", user.uid)
        );

        const snapshot = await getDocs(ordersQuery);

        if (snapshot.empty) {
            ordersList.innerHTML = `
                <div class="empty">
                    Henüz bir siparişiniz bulunmuyor.
                </div>
            `;
            return;
        }

        ordersList.innerHTML = "";

        snapshot.forEach((docSnapshot) => {
            const order = docSnapshot.data();

            const orderCard = document.createElement("div");
            orderCard.className = "order-card";

            orderCard.innerHTML = `
                <div class="order-header">
                    <strong>Sipariş #${docSnapshot.id.substring(0, 8)}</strong>
                    <span>${order.durum || "Hazırlanıyor"}</span>
                </div>

                <div class="order-info">
                    <p><strong>Ürün:</strong> ${order.urunAdi || "Ürün bilgisi yok"}</p>
                    <p><strong>Adet:</strong> ${order.adet || 1}</p>
                    <p><strong>Toplam:</strong> ${order.toplam || order.fiyat || "—"} TL</p>
                </div>
            `;

            ordersList.appendChild(orderCard);
        });

    } catch (error) {
        console.error("Siparişler yüklenemedi:", error);

        ordersList.innerHTML = `
            <div class="empty">
                Siparişler yüklenirken bir hata oluştu.
            </div>
        `;
    }
}


// KULLANICI GİRİŞ YAPTIĞINDA SİPARİŞLERİ HAZIRLA
onAuthStateChanged(auth, function(user) {
    if (user) {
        loadOrders(user);
    }
});
  </script>

</body>
</html>
