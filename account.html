    /* =====================================================
   NERIS PREMIUM ACCOUNT DESIGN
   ===================================================== */

:root {
    --neris-black: #050505;
    --neris-card: #0b0b0b;
    --neris-border: #242424;
    --neris-text: #f4f1eb;
    --neris-muted: #8d8d8d;
    --neris-gold: #c9a45c;
}

/* GENEL */
body {
    background: var(--neris-black) !important;
    color: var(--neris-text) !important;
    font-family: Arial, Helvetica, sans-serif;
}

/* ÜST LOGO */
.logo {
    color: var(--neris-gold) !important;
    letter-spacing: 5px !important;
    font-family: Georgia, "Times New Roman", serif !important;
    font-weight: 600 !important;
}

/* ANA İÇERİK */
.account-container {
    max-width: 1100px !important;
    margin: 0 auto !important;
    padding: 75px 30px 120px !important;
}

/* BAŞLIK */
.title {
    font-family: Georgia, "Times New Roman", serif !important;
    font-size: 52px !important;
    font-weight: 400 !important;
    letter-spacing: -1px !important;
    margin-bottom: 12px !important;
    color: #f5f2ec !important;
}

.subtitle {
    color: #8d8d8d !important;
    font-size: 14px !important;
    letter-spacing: .3px !important;
    margin-bottom: 55px !important;
}

/* GRID */
.account-grid {
    display: grid !important;
    grid-template-columns: 235px 1fr !important;
    gap: 55px !important;
    align-items: start !important;
}

/* SOL MENÜ */
.card.menu {
    background: transparent !important;
    border: 0 !important;
    padding: 0 !important;
}

.menu button {
    width: 100% !important;
    background: transparent !important;
    border: 0 !important;
    border-bottom: 1px solid #202020 !important;
    color: #a4a4a4 !important;
    text-align: left !important;
    padding: 20px 4px !important;
    font-size: 13px !important;
    letter-spacing: .8px !important;
    transition: all .3s ease !important;
    cursor: pointer !important;
}

.menu button:first-child {
    border-top: 1px solid #202020 !important;
}

.menu button:hover {
    color: #f5f2ec !important;
    padding-left: 10px !important;
}

.menu button.active {
    color: var(--neris-gold) !important;
    padding-left: 10px !important;
}

/* SAĞ KART */
.card:not(.menu) {
    background: #090909 !important;
    border: 1px solid #242424 !important;
    padding: 42px !important;
    min-height: 300px !important;
}

/* BÖLÜM BAŞLIĞI */
.section-title {
    font-family: Georgia, "Times New Roman", serif !important;
    font-size: 31px !important;
    font-weight: 400 !important;
    color: #f5f2ec !important;
    letter-spacing: -.4px !important;
    margin: 0 0 32px !important;
}

/* HESAP BİLGİLERİ */
.info-row {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    padding: 20px 0 !important;
    border-bottom: 1px solid #202020 !important;
}

.info-row .label {
    color: #777 !important;
    font-size: 12px !important;
    letter-spacing: 1px !important;
    text-transform: uppercase !important;
}

.info-row .value {
    color: #eee !important;
    font-size: 14px !important;
}

/* SİPARİŞ LİSTESİ */
#ordersList {
    display: flex !important;
    flex-direction: column !important;
    gap: 18px !important;
}

/* SİPARİŞ KARTI */
.order-card {
    background: #0d0d0d !important;
    border: 1px solid #252525 !important;
    padding: 28px !important;
    transition: border-color .3s ease, transform .3s ease !important;
}

.order-card:hover {
    border-color: #51462f !important;
    transform: translateY(-2px) !important;
}

.order-header {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    padding-bottom: 20px !important;
    border-bottom: 1px solid #202020 !important;
    margin-bottom: 20px !important;
}

.order-number {
    color: #777 !important;
    font-size: 11px !important;
    letter-spacing: 1.5px !important;
    text-transform: uppercase !important;
}

.order-status {
    color: var(--neris-gold) !important;
    font-size: 10px !important;
    letter-spacing: 1.5px !important;
    text-transform: uppercase !important;
}

.order-product {
    color: #f3f0ea !important;
    font-family: Georgia, "Times New Roman", serif !important;
    font-size: 22px !important;
    margin-bottom: 18px !important;
}

.order-details {
    display: flex !important;
    gap: 25px !important;
    color: #888 !important;
    font-size: 12px !important;
}

.order-total {
    margin-left: auto !important;
    color: #eee !important;
}

.order-total strong {
    color: var(--neris-gold) !important;
    font-size: 16px !important;
    font-weight: 400 !important;
}

/* BOŞ ALAN */
.empty {
    color: #777 !important;
    border: 1px solid #202020 !important;
    padding: 45px 25px !important;
    text-align: center !important;
    font-size: 13px !important;
    letter-spacing: .3px !important;
}

/* MESAJ */
#message {

    font-size: 13px !important;
}

/* MOBİL */
@media (max-width: 700px) {

    .order-total {
        margin-left: 0 !important;

        padding-top: 12px !important;
        border-top: 1px solid #202020 !important;

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import {
    getFirestore,
    collection,

    orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // NERIS FIREBASE

    const firebaseConfig = {

      apiKey: "AIzaSyAQ0ses6c9fJnk5xDsh37-0-fLcCj-MVQw",

      authDomain: "neris-78944.firebaseapp.com",

      projectId: "neris-78944",

      storageBucket: "neris-78944.firebasestorage.app",

      messagingSenderId: "58960639184",

      appId: "1:58960639184:web:dc25f186f8887f64f1dad5",

      measurementId: "G-CVD06X8B82"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    // GİRİŞ KONTROLÜ

    onAuthStateChanged(auth, function(user) {

      if (!user) {

        window.location.href = "giris.html";

        return;

      }


      const name =
        user.displayName ||
        user.email.split("@")[0];


      document.getElementById("userName").textContent = name;

      document.getElementById("userEmail").textContent =
        user.email;

      document.getElementById("userId").textContent =
        user.uid;

    });


    // ÇIKIŞ — MOBİL VE MASAÜSTÜ
    // Tek dokunuşla Firebase oturumunu kapatır ve ana sayfaya döner.
    window.logout = async function(event) {

      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const logoutButton = event?.currentTarget || document.querySelector('.menu button[onclick*="logout"]');

      if (logoutButton) {
        logoutButton.disabled = true;
        logoutButton.style.pointerEvents = "none";
        logoutButton.style.opacity = "0.65";
      }

      try {
        await signOut(auth);

        // Sitede kullanıcı adı tutuluyorsa onu da temizle.
        try {
          localStorage.removeItem("nerisUserName");
          sessionStorage.removeItem("nerisUserName");
        } catch (storageError) {
          console.warn("Yerel kullanıcı bilgisi temizlenemedi:", storageError);
        }

        // Çıkış tamamlandıktan sonra ana sayfaya dön.
        window.location.replace("index.html");

      } catch (error) {
        console.error("Çıkış yapılamadı:", error);

        if (logoutButton) {
          logoutButton.disabled = false;
          logoutButton.style.pointerEvents = "";
          logoutButton.style.opacity = "";
        }

        alert("Çıkış yapılırken bir hata oluştu. Lütfen tekrar deneyin.");
      }
    };


    // MENÜLER

    window.showSection = function(section, button) {

      document.getElementById("profile").style.display = "none";

      document.getElementById("orders").style.display = "none";

      document.getElementById("favorites").style.display = "none";


      document.getElementById(section).style.display = "block";


      document.querySelectorAll(".menu button")
        .forEach(function(btn) {

          btn.classList.remove("active");

        });


      button.classList.add("active");

    };
// SİPARİŞLERİ FIREBASE'DEN GETİR
async function loadOrders(user) {
    const ordersList = document.getElementById("ordersList");

    if (!ordersList) return;

    ordersList.innerHTML = `
        <div class="empty">
            Siparişleriniz yükleniyor...
        </div>
    `;

    try {
        const ordersQuery = query(
            collection(db, "siparisler"),
            where("kullaniciId", "==", user.uid)
        );

        const snapshot = await getDocs(ordersQuery);

        if (snapshot.empty) {
            ordersList.innerHTML = `
                <div class="empty">
                    Henüz bir siparişiniz bulunmuyor.
                </div>
            `;
            return;
        }

        ordersList.innerHTML = "";

        snapshot.forEach((docSnapshot) => {
            const order = docSnapshot.data();

            const orderCard = document.createElement("div");
            orderCard.className = "order-card";

            orderCard.innerHTML = `
    <div class="order-header">
        <span class="order-number">
            Sipariş #${docSnapshot.id.substring(0, 8)}
        </span>

        <span class="order-status">
            ${order.durum || "Hazırlanıyor"}
        </span>
    </div>

    <div class="order-product">
        ${order.urunAdi || "Ürün bilgisi yok"}
    </div>

    <div class="order-details">
        <span>${order.adet || 1} adet</span>

        <span class="order-total">
            <strong>
                ${(order.toplam || order.fiyat || 0).toLocaleString("tr-TR")} TL
            </strong>
        </span>
    </div>
`;

            ordersList.appendChild(orderCard);
        });

    } catch (error) {
        console.error("Siparişler yüklenemedi:", error);

        ordersList.innerHTML = `
            <div class="empty">
                Siparişler yüklenirken bir hata oluştu.
            </div>
        `;
    }
}
// FAVORİLERİ FIREBASE'DEN GETİR
async function loadFavorites(user) {
    const favoritesList = document.getElementById("favoritesList");

    if (!favoritesList) return;

    favoritesList.innerHTML = `
        <div class="empty">
            Favorileriniz yükleniyor...
        </div>
    `;

    try {
        const favoritesQuery = query(
            collection(db, "favoriler"),
            where("userId", "==", user.uid)
        );

        const snapshot = await getDocs(favoritesQuery);

        if (snapshot.empty) {
            favoritesList.innerHTML = `
                <div class="empty">
                    Henüz favorilerinize eklediğiniz bir ürün bulunmuyor.
                </div>
            `;
            return;
        }

        favoritesList.innerHTML = "";

        snapshot.forEach((docSnapshot) => {
            const favorite = docSnapshot.data();

            const favoriteCard = document.createElement("div");
            favoriteCard.className = "favorite-card";

            favoriteCard.innerHTML = `
                <div class="favorite-image">
                    ${
                        favorite.image
                            ? `<img src="${favorite.image}" alt="${favorite.name || "Ürün"}">`
                            : `<div class="favorite-no-image">NERIS</div>`
                    }
                </div>

                <div class="favorite-content">
                    <div class="favorite-name">
                        ${favorite.name || favorite.urunAdi || "Ürün"}
                    </div>

                    <div class="favorite-price">
                        ${Number(favorite.price || favorite.fiyat || 0).toLocaleString("tr-TR")} TL
                    </div>

                    <button
                        class="favorite-view"
                        onclick="window.location.href='ürün.html?id=${favorite.productId || favorite.urunId || docSnapshot.id}'">
                        Ürünü Gör
                    </button>
                </div>
            `;

            favoritesList.appendChild(favoriteCard);
        });

    } catch (error) {
        console.error("Favoriler yüklenemedi:", error);

        favoritesList.innerHTML = `
            <div class="empty">
                Favoriler yüklenirken bir hata oluştu.
            </div>
        `;
    }
}

// KULLANICI GİRİŞ YAPTIĞINDA SİPARİŞLERİ HAZIRLA
onAuthStateChanged(auth, function(user) {
    if (user) {
        loadOrders(user);
    }
});
