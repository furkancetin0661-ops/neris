<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NERIS Admin Giriş</title>

    <link rel="stylesheet" href="css/admin-login.css">

</head>

<body>

    <div class="login-box">

        <h1>NERIS</h1>

        <p>Admin Paneli</p>

        <input
            type="text"
            id="username"
            placeholder="Kullanıcı Adı">

        <input
            type="password"
            id="password"
            placeholder="Şifre">

        <button id="loginBtn">
            Giriş Yap
        </button>

        <p id="error"></p>

    </div>

    <script src="js/admin-login.js"></script>

</body>

</html>
