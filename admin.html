<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Neris Admin</title>
</head>

<body style="background:black;color:white;padding:40px">

<h2>Ürün Ekle</h2>

<input id="name" placeholder="Ürün adı"><br><br>
<input id="price" placeholder="Fiyat"><br><br>
<input id="img" placeholder="Görsel URL"><br><br>
<input id="link" placeholder="Shopier link"><br><br>

<button onclick="addProduct()">EKLE</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcoeTk7aZhocmMQVPMHjVK-NfG0JUiS7I",
  authDomain: "nerissite-dc8ec.firebaseapp.com",
  projectId: "nerissite-dc8ec",
  storageBucket: "nerissite-dc8ec.firebasestorage.app",
  messagingSenderId: "943518451048",
  appId: "1:943518451048:web:e07e8594f5c1cc53c1c2dd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addProduct = async function() {
  await addDoc(collection(db, "products"), {
    name: document.getElementById("name").value,
    price: document.getElementById("price").value,
    img: document.getElementById("img").value,
    link: document.getElementById("link").value
  });

  alert("Ürün eklendi!");
}
</script>

</body>
</html>
