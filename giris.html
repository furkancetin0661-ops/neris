<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neris | Giriş Yap</title>
<meta name="description" content="Neris hesabınıza güvenli şekilde giriş yapın.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Poppins,sans-serif;background:#070707;color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,rgba(212,175,55,.08),transparent 32%),linear-gradient(135deg,#050505,#0b0b0b 55%,#050505);z-index:-2}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,rgba(212,175,55,.025) 50%,transparent 80%);animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,100%{transform:translateX(-25%)}50%{transform:translateX(25%)}}
.card{width:min(460px,100%);padding:44px 42px 38px;background:rgba(12,12,12,.96);border:1px solid rgba(212,175,55,.22);box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative}
.logo{font-family:'Playfair Display',serif;letter-spacing:7px;text-align:center;color:#d4af37;font-size:31px;margin-bottom:8px}
.kicker{text-align:center;color:#888;font-size:10px;letter-spacing:3px;margin-bottom:32px;text-transform:uppercase}
h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:500;text-align:center;margin:0 0 9px}
.sub{text-align:center;color:#999;font-size:12px;line-height:1.7;margin:0 auto 28px;max-width:330px}
.field{margin-bottom:16px}
label{display:block;color:#aaa;font-size:11px;letter-spacing:1.2px;margin-bottom:8px}
input{width:100%;height:50px;background:#111;border:1px solid #282828;color:#fff;padding:0 15px;outline:none;transition:.25s;border-radius:2px}
input:focus{border-color:rgba(212,175,55,.75);box-shadow:0 0 0 3px rgba(212,175,55,.07)}
button{width:100%;height:51px;border:1px solid #d4af37;background:linear-gradient(135deg,#c99f2d,#efd36b);color:#080808;font-size:11px;font-weight:600;letter-spacing:1.5px;cursor:pointer;margin-top:7px;transition:.25s}
button:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(212,175,55,.18)}
button:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:none}
.message{display:none;margin-top:15px;padding:12px 13px;border:1px solid rgba(212,175,55,.22);background:#101010;color:#bbb;font-size:11px;line-height:1.6;text-align:center}
.message.show{display:block}.message.error{border-color:rgba(180,70,70,.35);color:#e0aaaa}
.back{text-align:center;margin-top:22px}.back a{color:#888;text-decoration:none;font-size:11px;letter-spacing:1px}.back a:hover{color:#d4af37}
.divider{height:1px;background:rgba(255,255,255,.07);margin:28px 0 19px}
.register{text-align:center;color:#777;font-size:11px}.register a{color:#d4af37;text-decoration:none;margin-left:5px}
@media(max-width:520px){body{padding:16px}.card{padding:34px 22px 30px}.logo{font-size:27px}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="card">
  <div class="logo">NERIS</div>
  <div class="kicker">Premium Women's Boutique</div>
  <h1>Hesabınıza Giriş Yapın</h1>
  <p class="sub">Siparişlerinizi, favorilerinizi ve hesap bilgilerinizi tek yerden yönetin.</p>
  <form id="loginForm">
    <div class="field"><label for="email">E-POSTA</label><input id="email" type="email" autocomplete="email" required placeholder="ornek@mail.com"></div>
    <div class="field"><label for="password">ŞİFRE</label><input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
    <button id="loginButton" type="submit">GİRİŞ YAP</button>
  </form>
  <div id="message" class="message"></div>
  <div class="divider"></div>
  <div class="register">Hesabınız yok mu?<a href="register.html">ÜYE OL</a></div>
  <div class="back"><a href="index.html">← NERIS ANA SAYFA</a></div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAQ0ses6c9fJnk5xDsh37-0-fLcCj-MVQw",authDomain:"neris-78944.firebaseapp.com",projectId:"neris-78944",storageBucket:"neris-78944.firebasestorage.app",messagingSenderId:"58960639184",appId:"1:58960639184:web:dc25f186f8887f64f1dad5",measurementId:"G-CVD0X6X882"};
const auth=getAuth(initializeApp(firebaseConfig));
setPersistence(auth, browserLocalPersistence).catch(()=>{});
const form=document.getElementById('loginForm'), btn=document.getElementById('loginButton'), msg=document.getElementById('message');
function show(text,error=false){msg.textContent=text;msg.className='message show'+(error?' error':'')}
onAuthStateChanged(auth,user=>{ if(user && sessionStorage.getItem('nerisLoginRedirect')==='1'){sessionStorage.removeItem('nerisLoginRedirect');window.location.replace('index.html?login=1');} });
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
 btn.disabled=true;btn.textContent='GİRİŞ YAPILIYOR';msg.className='message';
 try{
   await setPersistence(auth, browserLocalPersistence);
   const credential=await signInWithEmailAndPassword(auth,email,password);
   const displayName=(credential.user.displayName&&credential.user.displayName.trim()) ? credential.user.displayName.trim() : email.split('@')[0];
   try{localStorage.setItem('nerisUserName',displayName);}catch(e){}
   sessionStorage.setItem('nerisLoginRedirect','1');
   show('Giriş başarılı. Ana sayfaya yönlendiriliyorsunuz.');
   setTimeout(()=>window.location.replace('index.html?login=1'),450);
 }
 catch(err){let t='E-posta veya şifre hatalı. Lütfen bilgilerinizi kontrol edin.';if(err.code==='auth/user-not-found')t='Bu e-posta ile kayıtlı bir hesap bulunamadı.';if(err.code==='auth/invalid-credential')t='E-posta veya şifre hatalı.';if(err.code==='auth/too-many-requests')t='Çok fazla deneme yapıldı. Lütfen biraz sonra tekrar deneyin.';show(t,true);btn.disabled=false;btn.textContent='GİRİŞ YAP'}
});
</script>
</body>
</html>
