<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NERIS | Giriş Yap</title>

    <meta name="description" content="Neris hesabınıza giriş yapın. Siparişlerinizi ve hesabınızı kolayca yönetin.">
    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://neris.com.tr/login.html">

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 440px;
            background: #0d0d0d;
            border: 1px solid #292929;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,.45);
        }

        .logo {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #d4af37;
            font-family: Georgia, serif;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 35px;
        }

        .login-title {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 28px;
            margin: 0 0 10px;
        }

        .login-subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #ccc;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            background: #151515;
            border: 1px solid #333;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: .2s;
        }

        .form-group input:focus {
            border-color: #d4af37;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            background: #d4af37;
            color: #080808;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
        }

        .login-button:hover {
            background: #e5c04a;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 12px;
            color: #aaa;
            font-size: 13px;
            text-decoration: none;
        }

        .forgot:hover {
            color: #d4af37;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 30px 0;
            color: #666;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #292929;
        }

        .back-home {
            display: block;
            text-align: center;
            color: #d4af37;
            text-decoration: none;
            font-size: 13px;
            margin-top: 25px;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            border: 1px solid #333;
            color: #ccc;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 35px 24px;
            }

            .login-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <a href="index.html" class="logo">NERIS</a>

            <h1 class="login-title">Giriş Yap</h1>

            <p class="login-subtitle">
                Neris hesabınıza giriş yapın
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">E-posta</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="E-posta adresiniz"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Şifreniz"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    GİRİŞ YAP
                </button>

                <a href="#" class="forgot">
                    Şifremi Unuttum
                </a>

            </form>

            <div class="divider">
                VEYA
            </div>

            <a href="index.html" class="back-home">
                ← Ana Sayfaya Dön
            </a>

            <div id="message" class="message"></div>

        </div>

    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const message = document.getElementById("message");

            message.style.display = "block";
            message.textContent =
                "Giriş sistemi bağlantısı bir sonraki aşamada etkinleştirilecek.";
        });
    </script>

</body>
</html>
