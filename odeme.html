<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NERİS | Ödeme</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background: #111;
            padding: 40px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            background: gold;
            color: black;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Ödeme Sayfası</h2>
    <p>Siparişinizi tamamlamak üzeresiniz</p>

    <button onclick="odemeYap()">Ödemeye Geç</button>
</div>

<script>
function odemeYap() {
    alert("Shopier bağlanacak buraya");
}
</script>

</body>
</html>
