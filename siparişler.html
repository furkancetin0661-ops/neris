<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neris | Siparişlerim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--panel:#0d0d0d;--line:rgba(212,175,55,.20);--gold:#d4af37;--gold2:#e2c45c;--text:#f5f1e8;--muted:#8d8a84}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0%,rgba(212,175,55,.035),transparent 35%);z-index:-1}
.page{min-height:100vh;padding:92px 24px 80px;display:flex;justify-content:center;align-items:flex-start}
.orders-wrap{width:min(980px,100%);animation:ordersIn .65s cubic-bezier(.22,.61,.36,1) both}
@keyframes ordersIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{text-align:center;color:var(--gold);font-size:11px;letter-spacing:5px;margin-bottom:15px;font-weight:500}
h1{font-family:"Playfair Display",Georgia,serif;text-align:center;font-size:54px;line-height:1.1;margin:0;font-weight:600;letter-spacing:-1px}
.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 20px}
.gold-line{width:48px;height:2px;background:var(--gold);margin:0 auto 48px}
.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.018),rgba(0,0,0,.08));min-height:270px;display:flex;align-items:center;justify-content:center;padding:52px 30px;box-shadow:0 25px 70px rgba(0,0,0,.22)}
.state{text-align:center;max-width:600px;animation:stateIn .55s .08s cubic-bezier(.22,.61,.36,1) both}
@keyframes stateIn{from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.icon{width:58px;height:58px;border:1px solid rgba(212,175,55,.45);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;color:var(--gold);font-size:23px;font-family:Georgia,serif}
h2{font-family:"Playfair Display",Georgia,serif;font-size:30px;margin:0 0 12px;font-weight:600}
.state p{margin:0;color:#88847e;font-size:14px;line-height:1.8}
.actions{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:150px;height:46px;padding:0 22px;border:1px solid var(--gold);background:transparent;color:var(--gold2);font:500 11px Poppins,sans-serif;letter-spacing:2px;text-decoration:none;cursor:pointer;transition:transform .25s ease,background .25s ease,color .25s ease,box-shadow .25s ease}
.btn:hover{background:var(--gold);color:#080808;transform:translateY(-2px);box-shadow:0 10px 25px rgba(212,175,55,.13)}
.btn:active{transform:translateY(0) scale(.98)}
.order-list{width:100%;display:grid;gap:14px}
.order-card{border:1px solid rgba(212,175,55,.16);padding:22px 24px;background:#0b0b0b;display:grid;grid-template-columns:1fr auto;gap:10px 20px;animation:ordersIn .5s ease both}
.order-card h3{font-family:"Playfair Display",Georgia,serif;font-size:20px;margin:0 0 5px}.order-meta{color:#85817b;font-size:12px}.order-status{align-self:center;border:1px solid rgba(212,175,55,.35);color:var(--gold);padding:7px 11px;font-size:10px;letter-spacing:1.5px}.order-price{grid-column:1/-1;color:var(--gold2);font-size:14px;margin-top:5px}
.back{display:block;text-align:center;margin-top:28px;color:#77736d;text-decoration:none;font-size:12px;letter-spacing:1px;transition:color .2s ease,transform .2s ease}.back:hover{color:var(--gold);transform:translateY(-1px)}
@media(max-width:600px){.page{padding:60px 16px 55px}.eyebrow{font-size:9px;letter-spacing:3.5px}h1{font-size:38px}.subtitle{font-size:12px}.gold-line{margin-bottom:30px}.panel{padding:40px 20px;min-height:300px}.icon{width:52px;height:52px;font-size:21px}h2{font-size:25px}.state p{font-size:13px}.btn{width:100%;max-width:260px}.order-card{grid-template-columns:1fr}.order-status{justify-self:start}}
</style>
</head>
<body>
<main class="page">
  <section class="orders-wrap" aria-live="polite">
    <div class="eyebrow">NERIS ACCOUNT</div>
    <h1>Siparişlerim</h1>
    <p class="subtitle">Neris üzerinden verdiğiniz siparişler</p>
    <div class="gold-line"></div>
    <div id="ordersPanel" class="panel">
      <div class="state">
        <div class="icon">⋯</div>
        <h2>Hesabınız kontrol ediliyor</h2>
        <p>Sipariş bilgileriniz güvenli şekilde yükleniyor.</p>
      </div>
    </div>
    <a class="back" href="index.html">← Ana Sayfaya Dön</a>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyAQ0ses6c9fJnk5xDsh37-0-fLcCj-MVQw",
  authDomain:"neris-78944.firebaseapp.com",
  projectId:"neris-78944",
  storageBucket:"neris-78944.firebasestorage.app",
  messagingSenderId:"58960639184",
  appId:"1:58960639184:web:dc25f186f8887f64f1dad5",
  measurementId:"G-CVD0X6X882"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const panel=document.getElementById('ordersPanel');

function showLoggedOut(){
  panel.innerHTML=`<div class="state">
    <div class="icon">♙</div>
    <h2>Giriş Yapmalısınız</h2>
    <p>Siparişlerinizi görüntülemek için Neris hesabınıza giriş yapın.</p>
    <div class="actions"><a class="btn" href="giris.html">GİRİŞ YAP</a></div>
  </div>`;
}

function showEmpty(){
  panel.innerHTML=`<div class="state">
    <div class="icon">✓</div>
    <h2>Henüz siparişiniz yok</h2>
    <p>Verdiğiniz siparişler burada güvenli ve düzenli bir şekilde görünecek.</p>
    <div class="actions"><a class="btn" href="index.html#products">ALIŞVERİŞE BAŞLA</a></div>
  </div>`;
}

function showOrders(orders){
  const list=document.createElement('div'); list.className='order-list';
  orders.forEach((o,i)=>{
    const card=document.createElement('article'); card.className='order-card'; card.style.animationDelay=(i*.05)+'s';
    const no=o.siparisNo||o.orderNo||o.id||'Sipariş';
    const status=o.durum||o.status||'Alındı';
    const price=o.toplam||o.total||o.fiyat||'';
    card.innerHTML=`<div><h3>${escapeHtml(String(no))}</h3><div class="order-meta">Siparişiniz NERIS tarafından alınmıştır.</div></div><div class="order-status">${escapeHtml(String(status))}</div>${price?`<div class="order-price">Toplam: ₺${escapeHtml(String(price))}</div>`:''}`;
    list.appendChild(card);
  });
  panel.innerHTML='';panel.appendChild(list);
}

function escapeHtml(value){return value.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

async function loadOrders(user){
  // Sipariş koleksiyonu henüz kullanılmıyorsa bile kullanıcıya doğru premium boş durum gösterilir.
  try{
    const candidates=['siparisler','Siparişler','siparişler'];
    let found=[];
    for(const name of candidates){
      try{
        const snap=await getDocs(query(collection(db,name),where('kullaniciId','==',user.uid)));
        if(!snap.empty){snap.forEach(d=>found.push({id:d.id,...d.data()}));break;}
      }catch(e){/* Koleksiyon yoksa sıradakini dene. */}
    }
    if(found.length) showOrders(found); else showEmpty();
  }catch(e){
    console.warn('Siparişler yüklenemedi:',e);
    showEmpty();
  }
}

onAuthStateChanged(auth,user=>{
  if(user) loadOrders(user);
  else showLoggedOut();
});
</script>
</body>
</html>
