<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neris | Siparişlerim</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --white:#ffffff;
  --cream:#faf9f6;
  --soft:#f5f4f1;
  --gold:#c9a227;
  --gold-light:#dfc45d;
  --gold-dark:#a88617;
  --text:#191919;
  --muted:#77736b;
  --line:#e8e5dc;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(201,162,39,.07),transparent 35%),
    linear-gradient(180deg,#fff 0%,#faf9f6 100%);
  color:var(--text);
  font-family:Poppins,Arial,sans-serif;
  overflow-x:hidden;
}

/* Üst ince premium çizgi */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--gold),
    var(--gold-light),
    var(--gold),
    transparent
  );
  z-index:9999;
}

/* SAYFA */
.page{
  min-height:100vh;
  padding:88px 24px 70px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.orders-wrap{
  width:min(980px,100%);
  animation:pageIn .7s cubic-bezier(.22,.61,.36,1) both;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ÜST BAŞLIK */
.eyebrow{
  text-align:center;
  color:var(--gold-dark);
  font-size:10px;
  letter-spacing:5px;
  margin-bottom:14px;
  font-weight:600;
}

h1{
  font-family:"Playfair Display",Georgia,serif;
  text-align:center;
  font-size:54px;
  line-height:1.1;
  margin:0;
  font-weight:600;
  letter-spacing:-.7px;
  color:#181818;
}

.subtitle{
  text-align:center;
  color:#85827b;
  font-size:13px;
  margin:14px 0 20px;
  font-weight:300;
}

.gold-line{
  width:55px;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
  margin:0 auto 46px;
  position:relative;
}

.gold-line::after{
  content:"";
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--gold);
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* ANA PANEL */
.panel{
  position:relative;
  border:1px solid #e5e1d6;
  background:rgba(255,255,255,.96);
  min-height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:58px 35px;
  box-shadow:
    0 25px 70px rgba(0,0,0,.07),
    0 2px 8px rgba(0,0,0,.025);
  overflow:hidden;
}

/* Panel üst altın çizgi */
.panel::before{
  content:"";
  position:absolute;
  top:0;
  left:12%;
  right:12%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
}

/* Çok hafif dekoratif köşeler */
.panel::after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  right:-65px;
  bottom:-65px;
  border:1px solid rgba(201,162,39,.12);
  transform:rotate(45deg);
}

/* DURUM */
.state{
  text-align:center;
  max-width:620px;
  animation:stateIn .55s .08s cubic-bezier(.22,.61,.36,1) both;
}

@keyframes stateIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(.99);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* İKON */
.icon{
  width:64px;
  height:64px;
  border:1px solid rgba(201,162,39,.65);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 25px;
  color:var(--gold-dark);
  font-size:23px;
  font-family:Georgia,serif;
  background:linear-gradient(
    145deg,
    #fff,
    #faf8f1
  );
  box-shadow:
    0 8px 25px rgba(201,162,39,.08),
    inset 0 0 0 4px rgba(201,162,39,.025);
  position:relative;
}

.icon::after{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(201,162,39,.13);
  border-radius:50%;
}

/* BAŞLIK */
h2{
  font-family:"Playfair Display",Georgia,serif;
  font-size:30px;
  margin:0 0 12px;
  font-weight:600;
  color:#191919;
}

.state p{
  margin:0;
  color:#77746d;
  font-size:13px;
  line-height:1.85;
  font-weight:300;
}

/* BUTON */
.actions{
  margin-top:29px;
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:175px;
  height:48px;
  padding:0 24px;
  border:1px solid var(--gold);
  background:linear-gradient(
    135deg,
    #d7b438,
    #c39a1d
  );
  color:#fff;
  font:600 10px Poppins,sans-serif;
  letter-spacing:2px;
  text-decoration:none;
  cursor:pointer;
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    background .25s ease;
  box-shadow:0 8px 20px rgba(201,162,39,.13);
}

.btn:hover{
  background:linear-gradient(
    135deg,
    #e0c14e,
    #c9a227
  );
  transform:translateY(-3px);
  box-shadow:0 13px 30px rgba(201,162,39,.22);
}

.btn:active{
  transform:translateY(0) scale(.98);
}

/* SİPARİŞ LİSTESİ */
.order-list{
  width:100%;
  display:grid;
  gap:14px;
}

.order-card{
  position:relative;
  border:1px solid #e7e3d9;
  padding:23px 25px;
  background:#fff;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px 20px;
  animation:ordersIn .5s ease both;
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.order-card:hover{
  transform:translateY(-3px);
  border-color:rgba(201,162,39,.45);
  box-shadow:0 14px 35px rgba(0,0,0,.07);
}

.order-card h3{
  font-family:"Playfair Display",Georgia,serif;
  font-size:20px;
  margin:0 0 6px;
  color:#1a1a1a;
}

.order-meta{
  color:#85817a;
  font-size:11px;
}

.order-status{
  align-self:center;
  border:1px solid rgba(201,162,39,.45);
  color:var(--gold-dark);
  background:#fffdf7;
  padding:7px 12px;
  font-size:9px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.order-price{
  grid-column:1/-1;
  color:var(--gold-dark);
  font-size:13px;
  margin-top:5px;
  font-weight:500;
}

/* GERİ DÖN */
.back{
  display:flex;
  width:max-content;
  margin:28px auto 0;
  color:#85817a;
  text-decoration:none;
  font-size:11px;
  letter-spacing:1px;
  transition:
    color .2s ease,
    transform .2s ease;
}

.back:hover{
  color:var(--gold-dark);
  transform:translateY(-2px);
}

/* MOBİL */
@media(max-width:600px){

  .page{
    padding:58px 14px 45px;
  }

  .orders-wrap{
    width:100%;
  }

  .eyebrow{
    font-size:8px;
    letter-spacing:3.5px;
    margin-bottom:12px;
  }

  h1{
    font-size:38px;
    letter-spacing:-.3px;
  }

  .subtitle{
    font-size:11px;
    margin:12px 0 18px;
  }

  .gold-line{
    margin-bottom:28px;
  }

  .panel{
    min-height:330px;
    padding:45px 20px;
  }

  .panel::before{
    left:8%;
    right:8%;
  }

  .icon{
    width:56px;
    height:56px;
    font-size:21px;
    margin-bottom:22px;
  }

  h2{
    font-size:25px;
    line-height:1.25;
  }

  .state p{
    font-size:12px;
    line-height:1.8;
  }

  .actions{
    margin-top:25px;
  }

  .btn{
    width:100%;
    max-width:280px;
    height:50px;
  }

  .order-card{
    grid-template-columns:1fr;
    padding:20px;
  }

  .order-status{
    justify-self:start;
  }

  .order-price{
    grid-column:auto;
  }

  .back{
    font-size:10px;
  }
}

/* ÇOK KÜÇÜK EKRAN */
@media(max-width:380px){

  .page{
    padding-left:10px;
    padding-right:10px;
  }

  h1{
    font-size:34px;
  }

  .panel{
    padding:40px 16px;
  }

  h2{
    font-size:23px;
  }
}
</style>
</head>

<body>

<main class="page">

  <section class="orders-wrap" aria-live="polite">

    <div class="eyebrow">NERIS ACCOUNT</div>

    <h1>Siparişlerim</h1>

    <p class="subtitle">
      Neris üzerinden verdiğiniz siparişler
    </p>

    <div class="gold-line"></div>

    <div id="ordersPanel" class="panel">

      <div class="state">

        <div class="icon">⋯</div>

        <h2>Hesabınız kontrol ediliyor</h2>

        <p>
          Sipariş bilgileriniz güvenli şekilde yükleniyor.
        </p>

      </div>

    </div>

    <a class="back" href="index.html">
      ← Ana Sayfaya Dön
    </a>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig={

  apiKey:"AIzaSyAQ0ses6c9fJnk5xDsh37-0-fLcCj-MVQw",

  authDomain:"neris-78944.firebaseapp.com",

  projectId:"neris-78944",

  storageBucket:"neris-78944.firebasestorage.app",

  messagingSenderId:"58960639184",

  appId:"1:58960639184:web:dc25f186f8887f64f1dad5",

  measurementId:"G-CVD0X6X882"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const auth=getAuth(app);

const panel=document.getElementById('ordersPanel');


async function startNerisOrders(){

  try{

    await setPersistence(
      auth,
      browserLocalPersistence
    );

  }catch(error){

    console.warn(
      'Neris Auth persistence:',
      error
    );

  }


  onAuthStateChanged(
    auth,
    user=>{

      if(user){

        loadOrders(user);

      }else{

        showLoggedOut();

      }

    }
  );

}


function showLoggedOut(){

  panel.innerHTML=`

    <div class="state">

      <div class="icon">♙</div>

      <h2>Giriş Yapmalısınız</h2>

      <p>
        Siparişlerinizi görüntülemek için
        Neris hesabınıza giriş yapın.
      </p>

      <div class="actions">

        <a
          class="btn"
          href="giris.html"
        >
          GİRİŞ YAP
        </a>

      </div>

    </div>

  `;

}


function showEmpty(){

  panel.innerHTML=`

    <div class="state">

      <div class="icon">✓</div>

      <h2>Henüz siparişiniz yok</h2>

      <p>
        Verdiğiniz siparişler burada
        güvenli ve düzenli bir şekilde görünecek.
      </p>

      <div class="actions">

        <a
          class="btn"
          href="index.html#products"
        >
          ALIŞVERİŞE BAŞLA
        </a>

      </div>

    </div>

  `;

}


function showOrders(orders){

  const list=document.createElement('div');

  list.className='order-list';


  orders.forEach((o,i)=>{

    const card=document.createElement('article');

    card.className='order-card';

    card.style.animationDelay=(i*.05)+'s';


    const no=
      o.siparisNo ||
      o.orderNo ||
      o.id ||
      'Sipariş';


    const status=
      o.durum ||
      o.status ||
      'Alındı';


    const price=
      o.toplam ||
      o.total ||
      o.fiyat ||
      '';


    card.innerHTML=`

      <div>

        <h3>
          ${escapeHtml(String(no))}
        </h3>

        <div class="order-meta">
          Siparişiniz NERIS tarafından alınmıştır.
        </div>

      </div>

      <div class="order-status">
        ${escapeHtml(String(status))}
      </div>

      ${
        price
        ?
        `
        <div class="order-price">
          Toplam: ₺${escapeHtml(String(price))}
        </div>
        `
        :
        ''
      }

    `;


    list.appendChild(card);

  });


  panel.innerHTML='';

  panel.appendChild(list);

}


function escapeHtml(value){

  return value.replace(
    /[&<>'"]/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );

}


async function loadOrders(user){

  try{

    const candidates=[
      'siparisler',
      'Siparişler',
      'siparişler'
    ];

    let found=[];


    for(const name of candidates){

      try{

        const snap=await getDocs(
          query(
            collection(db,name),
            where(
              'kullaniciId',
              '==',
              user.uid
            )
          )
        );


        if(!snap.empty){

          snap.forEach(
            d=>{
              found.push({
                id:d.id,
                ...d.data()
              });
            }
          );

          break;

        }

      }catch(e){

        /*
          Koleksiyon yoksa
          sıradakini dene.
        */

      }

    }


    if(found.length){

      showOrders(found);

    }else{

      showEmpty();

    }

  }catch(e){

    console.warn(
      'Siparişler yüklenemedi:',
      e
    );

    showEmpty();

  }

}


startNerisOrders();

</script>

</body>
</html>
