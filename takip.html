<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neris | Sipariş Takip</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fffdf9,#f5f0e6);font-family:Arial,sans-serif;color:#211e19;display:flex;justify-content:center;padding:55px 18px}.wrap{width:min(780px,100%)}.logo{text-align:center;font:500 48px Georgia,serif;letter-spacing:10px}h1{text-align:center;font:500 34px Georgia,serif;margin:28px 0 8px}.sub{text-align:center;color:#82796d;font-size:13px;margin-bottom:30px}.search{background:#fff;border:1px solid rgba(185,145,72,.28);padding:22px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;box-shadow:0 15px 45px rgba(60,45,20,.08)}input,button{height:48px;border:1px solid #ddd3c3;padding:0 14px;font-size:13px}button{background:#b58a3e;color:#fff;border-color:#b58a3e;cursor:pointer;font-weight:600}#result{margin-top:20px}.card{background:#fff;border:1px solid rgba(185,145,72,.25);padding:25px;box-shadow:0 15px 45px rgba(60,45,20,.06)}.row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #eee7db;padding:12px 0;font-size:13px}.gold{color:#a77b32}.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.item img{width:55px;height:70px;object-fit:cover}.meta{color:#81786c;font-size:11px;margin-top:5px}.error{color:#a05b4b;text-align:center;padding:20px;border:1px solid #e7d1c8;background:#fff9f7}@media(max-width:650px){.search{grid-template-columns:1fr}.logo{font-size:38px}h1{font-size:29px}}
</style></head><body><main class="wrap"><div class="logo">NERIS</div><h1>Sipariş Takip</h1><div class="sub">Sipariş numaranız ve e-posta adresinizle güncel durumu görüntüleyin.</div><form class="search" id="form"><input id="orderNo" placeholder="Sipariş No (NER-...)" required><input id="email" type="email" placeholder="E-posta adresiniz" required><button>SORGULA</button></form><div id="result"></div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import {getFirestore,collection,getDocs,query,where} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";const firebaseConfig = {
  apiKey: "AIzaSyAQ0ses6c9fJnk5xDsh37-0-fLcCj-MVQw",
  authDomain: "neris-78944.firebaseapp.com",
  projectId: "neris-78944",
  storageBucket: "neris-78944.firebasestorage.app",
  messagingSenderId: "58960639184",
  appId: "1:58960639184:web:dc25f186f8887f64f1dad5",
  measurementId: "G-CVD0X6X882"
};
const db=getFirestore(initializeApp(firebaseConfig)),result=document.getElementById("result"),statuses=["Sipariş Alındı","Hazırlanıyor","Kargoya Verildi","Teslim Edildi"];const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();result.innerHTML="<div class='card'>Sorgulanıyor...</div>";const no=document.getElementById("orderNo").value.trim(),email=document.getElementById("email").value.trim().toLowerCase();try{const snap=await getDocs(query(collection(db,"siparisler"),where("siparisNo","==",no)));let order=null;snap.forEach(d=>{const x=d.data();if(String(x.kullaniciEmail||"").toLowerCase()===email)order={id:d.id,...x}});if(!order){result.innerHTML="<div class='error'>Sipariş bulunamadı. Sipariş numarası ve e-posta adresini kontrol edin.</div>";return}const idx=statuses.indexOf(order.durum||"Sipariş Alındı"),items=Array.isArray(order.urunler)?order.urunler:[];result.innerHTML=`<div class="card"><div class="row"><strong>${esc(order.siparisNo)}</strong><span class="gold">${esc(order.durum||"Sipariş Alındı")}</span></div><div>${items.map(i=>`<div class="item">${i.resim?`<img src="${esc(i.resim)}" alt="">`:""}<div><strong>${esc(i.urunAdi||"Neris Ürün")}</strong><div class="meta">Beden: ${esc(i.beden||"-")} · Adet: ${Number(i.adet)||1} · ${Number(i.fiyat||0).toLocaleString("tr-TR")} TL</div></div></div>`).join("")}</div><div class="row"><strong>Toplam</strong><strong class="gold">${Number(order.toplam||0).toLocaleString("tr-TR",{minimumFractionDigits:2})} TL</strong></div><div style="margin-top:20px">${statuses.map((s,i)=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;color:${i<=idx?"#a77b32":"#aaa"}"><span>${i<=idx?"✓":"○"}</span>${s}</div>`).join("")}</div></div>`}catch(err){console.error(err);result.innerHTML="<div class='error'>Sipariş sorgulanırken bir hata oluştu.</div>"}});
</script></body></html>
